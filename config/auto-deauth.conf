# WiFi Auto-Deauth Configuration
# Works with standard WiFi routers - no extra hardware needed
# Detects and triggers deauthentication on BSSID/SSID signals

[INTERFACE]
# Wireless interface name (wlan0, wlan1, etc)
interface = wlan0

[SCAN]
# Scan interval in seconds
scan_interval = 5

# Signal strength threshold to trigger deauth (dBm)
# -80 = very strong, -70 = strong, -60 = excellent
signal_threshold = -75

# Enable MAC address randomization after each deauth
randomize_mac = true

[DEAUTH]
# Number of deauthentication packets
packet_count = 10

# Deauth methods to use (mdk3, mdk4, aireplay)
methods = mdk3, mdk4, aireplay

# Delay between deauth cycles (seconds)
cycle_delay = 10

# Maximum deauth attempts per network
max_attempts = 5

[MDK3]
# MDK3 channels to target
channels = 1,6,11

# MDK3 options
# -d = deauthentication
# -b = BSSID
# -c = channels
enabled = true

[MDK4]
# MDK4 deauthentication mode
# d = deauth all clients
mode = d

enabled = true

[LOGGING]
# Log file location
logfile = /var/log/wifi-auto-deauth.log

# Log level (DEBUG, INFO, WARNING, ERROR)
level = INFO

# Save detected networks to JSON
save_json = true

json_file = /tmp/deauth_networks.json

[DETECTION]
# Enable hidden SSID detection
detect_hidden = true

# Minimum networks to detect before triggering
min_networks = 1

# Auto-start on network detection
auto_trigger = true

# Ignore specific BSSIDs (comma-separated)
ignore_bssid = 

[SAFETY]
# Enable warning before deauth
confirm_before_deauth = false

# Max deauth per minute (rate limiting)
rate_limit = 100

# Timeout for deauth operation (seconds)
timeout = 30
